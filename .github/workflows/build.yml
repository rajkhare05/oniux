name: Scheduled Oniux binary

on:
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: experiment
    steps:
      - name: Clone repo
        run: |
          git clone --depth 1 https://gitlab.torproject.org/tpo/core/oniux.git

      - name: Check for new commits
        id: check_commit
        env:
          LAST_COMMIT_HASH: ${{ vars.LAST_COMMIT_HASH }}
        run: |
          cd oniux
          REMOTE=$(git rev-parse origin/main)
          if [ "$REMOTE" != "$LAST_COMMIT_HASH" ]; then
            echo "new_commit=true" >> $GITHUB_OUTPUT
          else
            echo "new_commit=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate tag
        if: steps.check_commit.outputs.new_commit == 'true'
        id: tag
        run: |
          cd oniux
          TAG="exp-$(git rev-parse --short=8 HEAD)"
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          echo "NEW_COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Update LAST_COMMIT_HASH in environment
        if: steps.check_commit.outputs.new_commit == 'true'
        run: |
          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GH_WORKFLOW_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/environments/experiment/variables/LAST_COMMIT_HASH \
            -d '{"name":"LAST_COMMIT_HASH","value":"${{ env.NEW_COMMIT_HASH }}"}'

      - name: Install Rust toolchain
        if: steps.check_commit.outputs.new_commit == 'true'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          override: true

      - name: Build binary
        if: steps.check_commit.outputs.new_commit == 'true'
        run: |
          cd oniux
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare release asset
        if: steps.check_commit.outputs.new_commit == 'true'
        run: |
          cd oniux
          mkdir -p release
          cp target/x86_64-unknown-linux-gnu/release/oniux release/oniux-linux-x86_64

      - name: Create GitHub Release and Upload Binary
        if: steps.check_commit.outputs.new_commit == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: oniux/release/oniux-linux-x86_64

